packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

allowBuilds:
  esbuild: true
  unrs-resolver: true

audit:
  level: high

auditConfig: { ignoreGhsas: [ GHSA-vfj7-8cjw-p6xm ] }

overrides:
  source-map-js: 1.2.2
  sharp: 0.35.5
  "@modelcontextprotocol/sdk": 1.32.0
  zod: ">=4.6.6"
  body-parser: ">=2.4.0"
  undici: ">=7.30.1"
